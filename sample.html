<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contoh html-mp4</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="kanvas"></canvas>
<script>
  // Contoh visual yang kompatibel dengan html-mp4.
  // Kontraknya: satu <canvas>, semua gambar bergantung pada waktu t (detik),
  // dan window.renderFrame(t) menggambar satu frame secara sinkron.
  const c = document.getElementById('kanvas');
  const g = c.getContext('2d');
  const W = (c.width = window.innerWidth);
  const H = (c.height = window.innerHeight);

  function draw(t) {
    const hue = (t * 20) % 360;
    const bg = g.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, `hsl(${hue},70%,18%)`);
    bg.addColorStop(1, `hsl(${(hue + 60) % 360},70%,8%)`);
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    const n = 32;
    const bw = W / (n * 1.8);
    const gap = bw * 0.8;
    const base = H * 0.72;
    const startX = W / 2 - (n * (bw + gap)) / 2;
    for (let i = 0; i < n; i++) {
      const v = 0.5 + 0.5 * Math.sin(t * 3 + i * 0.45) * Math.cos(t * 1.3 + i * 0.2);
      const bh = v * H * 0.35 + H * 0.03;
      g.fillStyle = `hsl(${(hue + i * 6) % 360},80%,60%)`;
      g.fillRect(startX + i * (bw + gap), base - bh, bw, bh);
    }

    g.textAlign = 'center';
    g.fillStyle = '#fff';
    g.font = `700 ${H * 0.08}px system-ui, sans-serif`;
    g.fillText('Uji coba html-mp4', W / 2, H * 0.2);
    g.fillStyle = 'rgba(255,255,255,.75)';
    g.font = `500 ${H * 0.05}px system-ui, sans-serif`;
    g.fillText(`t = ${t.toFixed(2)} detik`, W / 2, H * 0.3);

    g.fillStyle = 'rgba(255,255,255,.2)';
    g.fillRect(W * 0.1, H * 0.9, W * 0.8, H * 0.02);
    g.fillStyle = '#fff';
    g.fillRect(W * 0.1, H * 0.9, W * 0.8 * ((t % 10) / 10), H * 0.02);
  }

  // Dipanggil perekam pada mode frame demi frame.
  let dikendalikan = false;
  window.renderFrame = function (t) {
    dikendalikan = true;
    draw(t);
  };

  // Jalan sendiri (mode real-time) selama belum dikendalikan perekam.
  const t0 = performance.now();
  (function loop() {
    if (!dikendalikan) draw((performance.now() - t0) / 1000);
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
